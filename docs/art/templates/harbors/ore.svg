<?xml version="1.0" encoding="UTF-8"?>
<!-- Asset key: harbor.ore - 2:1 ore harbor badge (0.42 hex wide), 1024 x 1024 px.
     The game draws the "2:1" and "ore" text on top; keep the blue areas calm
     (an icon of the resource works well around them). Pixels outside the rounded square
     are never shown. Delete the "guides" layer before export (PNG/WebP, sRGB, <= 400 KB).
     Theme entry: "harbor.ore": { "image": "harbors/ore.webp" } -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g id="art">
    <rect id="badge" x="0" y="0" width="1024" height="1024" rx="195" fill="#6f747c"/>
  </g>
  <g id="guides" fill="none" stroke-width="3" font-family="sans-serif" font-size="26">
    <rect x="0" y="0" width="1024" height="1024" rx="195" stroke="#ff2d55"/>
    <rect x="43.9" y="43.9" width="936.2" height="936.2" rx="151.2" stroke="#ff9500" stroke-dasharray="10 6"/>
    <rect x="197" y="229.2" width="630" height="331.6" stroke="#007aff" stroke-dasharray="12 8"/>
    <text x="512" y="215.2" fill="#007aff" text-anchor="middle">"2:1" label</text>
    <rect x="63.4" y="609.5" width="897.2" height="195" stroke="#007aff" stroke-dasharray="12 8"/>
    <text x="512" y="834.6" fill="#007aff" text-anchor="middle">"ore" label</text>
    <text x="512" y="83.9" fill="#ff9500" text-anchor="middle">outline drawn inside the edge</text>
  </g>
</svg>
