<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexfall</title>
    <meta
      name="description"
      content="Build, trade and settle on a hex island. Online board game for 3–4 players in your browser."
    />
    <meta name="theme-color" content="#ecdcbc" />
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/ui/parchment.jpg" as="image" />
    <link rel="preload" href="/rules/goal.webp" as="image" fetchpriority="high" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hexfall" />
    <meta property="og:title" content="Hexfall" />
    <meta
      property="og:description"
      content="Build, trade and settle on a hex island. Online board game for 3–4 players in your browser."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hexfall: a mountain hex tile next to the game's name" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hexfall" />
    <meta
      name="twitter:description"
      content="Build, trade and settle on a hex island. Online board game for 3–4 players in your browser."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <style>
      /* First paint, before the JS bundle: the island picture and the name on parchment. React replaces
         the contents of #root once it mounts (its own Splash takes over from here). */
      html,
      body {
        margin: 0;
        background: #ecdcbc;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        /* Same parchment as the .paper surfaces (src/style.css) and the React Splash. */
        background-color: #ecdcbc;
        background-image:
          linear-gradient(rgb(247 237 213 / 20%), rgb(236 220 188 / 15%)), url("/ui/parchment.jpg");
        background-size:
          100% 100%,
          115% 120%;
        background-position: center;
        box-shadow: inset 0 0 22px rgb(135 98 53 / 23%);
        color: #2f5a43;
        font:
          600 44px/1 "Cormorant Garamond Variable",
          "Cormorant Garamond",
          Georgia,
          serif;
      }
      #boot img {
        width: min(480px, 86vw);
        height: auto;
        aspect-ratio: 16 / 9;
        mask-image: radial-gradient(ellipse 50% 50% at center, #000 70%, transparent 100%);
      }
      #boot i {
        width: 240px;
        height: 4px;
        border-radius: 2px;
        background: rgb(43 63 56 / 20%);
        overflow: hidden;
      }
      #boot i::after {
        content: "";
        display: block;
        width: 35%;
        height: 100%;
        background: #876235;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(290%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading Hexfall">
        <img src="/rules/goal.webp" alt="" width="960" height="540" />
        <span>Hexfall</span>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
