# Render Blueprint for the game server. See README "Deploy".
# In the Render dashboard: New > Blueprint, pick this repo. Render builds the
# root Dockerfile and redeploys on every push to main.
services:
  - type: web
    name: hexfall
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets: Render asks for these when the Blueprint is first applied.
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      # Optional turn notifications: add VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and
      # VAPID_SUBJECT in the dashboard (all three or none). They are not listed
      # here because an empty value fails the server's config check.
