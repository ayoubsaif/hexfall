# fly.toml app configuration file generated for hexfall on 2026-11-05T09:37:09+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hexfall'
primary_region = 'cdg'

[build]
[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[http_service.checks]]
grace_period = '10s'
interval = '30s'
method = 'GET'
path = '/healthz'
timeout = '5s'

[[vm]]
memory = '1gb'
cpus = 1
